name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-check, library build, demo site build, import smoke test.
      - run: npm run build
      # CI=true makes vitest fail on a missing golden trace instead of writing one.
      - run: npm test
